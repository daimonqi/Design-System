<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Download Buttons - Comet Animation</title>
    <!-- 引用同级目录下的样式文件 -->
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./game_download_btn.css">
    <style>
        .section-title {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-top: 40px;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .demo-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body style="background: #101017; padding: 40px; font-family: sans-serif;">
    <div style="max-width: 1000px; margin: 0 auto;">
        
        <h2 style="color: white; font-weight: 400; margin-bottom: 8px;">Game Download Buttons</h2>
        <p style="color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 32px;">PC-233 游戏下载按键样式 (带三层彗星动效)</p>

        <!-- 基础状态按钮 -->
        <h3 class="section-title">基础交互按钮 (参考)</h3>
        <div class="grid-layout">
            <div class="demo-column">
                <span class="group-title" style="color: rgba(255,255,255,0.5); font-size: 12px;">下载 / 游玩</span>
                
                <button class="btn-hifi" style="width: 296px; height: 48px;">
                    <span class="icon-slot" style="margin-right: 8px;">
                        <svg viewBox="0 0 16 16" width="16" height="16">
                            <path d="M4.5 5C4.22386 5 4 5.22386 4 5.5V7H2.5C2.22386 7 2 7.22386 2 7.5V8.5C2 8.77614 2.22386 9 2.5 9H4V10.5C4 10.7761 4.22386 11 4.5 11H5.5C5.77614 11 6 10.7761 6 10.5V9H7.5C7.77614 9 8 8.77614 8 8.5V7.5C8 7.22386 7.77614 7 7.5 7H6V5.5C6 5.22386 5.77614 5 5.5 5H4.5Z" fill="currentColor" opacity="0.8"/>
                            <path d="M11 7.5C11 7.22386 11.2239 7 11.5 7C11.7761 7 12 7.22386 12 7.5C12 7.77614 11.7761 8 11.5 8C11.2239 8 11 7.77614 11 7.5Z" fill="currentColor"/>
                            <path d="M12.5 9C12.2239 9 12 8.77614 12 8.5C12 8.22386 12.2239 8 12.5 8C12.7761 8 13 8.22386 13 8.5C13 8.77614 12.7761 9 12.5 9Z" fill="currentColor"/>
                            <path d="M14 7.5C14 7.22386 14.2239 7 14.5 7C14.7761 7 15 7.22386 15 7.5C15 7.77614 14.7761 8 14.5 8C14.2239 8 14 7.77614 14 7.5Z" fill="currentColor"/>
                            <path d="M12.5 7C12.2239 7 12 6.77614 12 6.5C12 6.22386 12.2239 6 12.5 6C12.7761 6 13 6.22386 13 6.5C13 6.77614 12.7761 7 12.5 7Z" fill="currentColor"/>
                            <path d="M1.5 4C0.671573 4 0 4.67157 0 5.5V10.5C0 11.8807 1.11929 13 2.5 13H4.5C5.05228 13 5.5 12.5523 5.5 12V11.5H10.5V12C10.5 12.5523 10.9477 13 11.5 13H13.5C14.8807 13 16 11.8807 16 10.5V5.5C16 4.67157 15.3284 4 14.5 4H1.5ZM1.5 5.5H14.5V10.5C14.5 11.0523 14.0523 11.5 13.5 11.5H11.5C11.2239 11.5 11 11.2761 11 11V10.5C11 10.2239 10.7761 10 10.5 10H5.5C5.22386 10 5 10.2239 5 10.5V11C5 11.2761 4.77614 11.5 4.5 11.5H2.5C1.94772 11.5 1.5 11.0523 1.5 10.5V5.5Z" fill="currentColor"/>
                        </svg>
                    </span>
                    开始游戏
                </button>
            </div>
        </div>

        <!-- 进度状态按钮 -->
        <h3 class="section-title">下载/安装进度状态</h3>
        <div class="grid-layout">
            <div class="demo-column">
                <span class="group-title" style="color: rgba(255,255,255,0.5); font-size: 12px;">进行中状态</span>
                <div class="btn-progress" style="width: 296px;">
                    <div class="btn-progress__content">
                        <span class="icon-slot">
                            <svg viewBox="0 0 12.25 14"><path d="M4.375 14H0V0H4.375V14ZM12.25 14H7.875V0H12.25V14Z" fill="currentColor"/></svg>
                        </span>
                        <div class="btn-progress__text-group">
                            <span class="btn-progress__title">游戏下载 25%</span>
                            <div class="btn-progress__size">
                                <span class="size-current">450MB</span>
                                <span class="size-divider">/</span>
                                <span class="size-total">1.80GB</span>
                            </div>
                        </div>
                    </div>
                    <div class="btn-progress__bar-wrapper">
                        <div class="btn-progress__bar" style="width: 25%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 动画演示 -->
        <h3 class="section-title">完成过渡动效演示 (点击模拟安装完成)</h3>
        <div style="padding: 20px; background: rgba(0,0,0,0.2); border-radius: 8px;">
            <div class="btn-progress btn-progress--installing" id="demo-btn" onclick="triggerFinishAnim()" style="width: 296px;">
                <div class="btn-progress__comet-layer">
                    <div class="comet-wrap">
                        <div class="comet-mist"></div>
                        <div class="comet-bloom"></div>
                        <div class="comet-core"></div>
                    </div>
                </div>
                <div class="btn-progress__content">
                    <span class="icon-slot" id="demo-icon-wrap" style="display: none;">
                        <svg viewBox="0 0 16 16">
                            <path d="M4.5 5C4.22386 5 4 5.22386 4 5.5V7H2.5C2.22386 7 2 7.22386 2 7.5V8.5C2 8.77614 2.22386 9 2.5 9H4V10.5C4 10.7761 4.22386 11 4.5 11H5.5C5.77614 11 6 10.7761 6 10.5V9H7.5C7.77614 9 8 8.77614 8 8.5V7.5C8 7.22386 7.77614 7 7.5 7H6V5.5C6 5.22386 5.77614 5 5.5 5H4.5Z" fill="currentColor" opacity="0.8"/>
                            <path d="M11 7.5C11 7.22386 11.2239 7 11.5 7C11.7761 7 12 7.22386 12 7.5C12 7.77614 11.7761 8 11.5 8C11.2239 8 11 7.77614 11 7.5Z" fill="currentColor"/>
                            <path d="M12.5 9C12.2239 9 12 8.77614 12 8.5C12 8.22386 12.2239 8 12.5 8C12.7761 8 13 8.22386 13 8.5C13 8.77614 12.7761 9 12.5 9Z" fill="currentColor"/>
                            <path d="M14 7.5C14 7.22386 14.2239 7 14.5 7C14.7761 7 15 7.22386 15 7.5C15 7.77614 14.7761 8 14.5 8C14.2239 8 14 7.77614 14 7.5Z" fill="currentColor"/>
                            <path d="M12.5 7C12.2239 7 12 6.77614 12 6.5C12 6.22386 12.2239 6 12.5 6C12.7761 6 13 6.22386 13 6.5C13 6.77614 12.7761 7 12.5 7Z" fill="currentColor"/>
                            <path d="M1.5 4C0.671573 4 0 4.67157 0 5.5V10.5C0 11.8807 1.11929 13 2.5 13H4.5C5.05228 13 5.5 12.5523 5.5 12V11.5H10.5V12C10.5 12.5523 10.9477 13 11.5 13H13.5C14.8807 13 16 11.8807 16 10.5V5.5C16 4.67157 15.3284 4 14.5 4H1.5ZM1.5 5.5H14.5V10.5C14.5 11.0523 14.0523 11.5 13.5 11.5H11.5C11.2239 11.5 11 11.2761 11 11V10.5C11 10.2239 10.7761 10 10.5 10H5.5C5.22386 10 5 10.2239 5 10.5V11C5 11.2761 4.77614 11.5 4.5 11.5H2.5C1.94772 11.5 1.5 11.0523 1.5 10.5V5.5Z" fill="currentColor"/>
                        </svg>
                    </span>
                    <div class="btn-progress__text-group" id="demo-text-group">
                        <span class="btn-progress__title" id="demo-text">模拟器安装中 80%</span>
                    </div>
                </div>
                <div class="btn-progress__bar-wrapper" id="demo-bar-wrapper">
                    <div class="btn-progress__bar" id="demo-bar" style="width: 80%;"></div>
                </div>
            </div>
            <p style="color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 12px;">点击按钮：触发 comet 彗星扫光 -> 状态切换 -> HIFI 最终态</p>
        </div>

    </div>

    <script>
        function triggerFinishAnim() {
            const btn = document.getElementById('demo-btn');
            const bar = document.getElementById('demo-bar');
            const text = document.getElementById('demo-text');
            const iconWrap = document.getElementById('demo-icon-wrap');
            
            if (btn.classList.contains('btn-progress--completed')) {
                btn.classList.remove('btn-progress--completed');
                btn.classList.add('btn-progress--installing');
                bar.style.width = '80%';
                text.innerText = '模拟器安装中 80%';
                iconWrap.style.display = 'none';
                return;
            }

            bar.style.width = '100%';
            text.innerText = '模拟器安装中 100%';
            
            setTimeout(() => {
                btn.classList.add('btn-progress--complete-anim');
                setTimeout(() => {
                    text.innerText = '开始游戏';
                    iconWrap.style.display = 'flex';
                    btn.classList.remove('btn-progress--installing');
                }, 600);
            }, 200);

            setTimeout(() => {
                btn.classList.remove('btn-progress--complete-anim');
                btn.classList.add('btn-progress--completed');
            }, 1600);
        }
    </script>
</body>
</html>
